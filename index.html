<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Arjun Mankuskar's Portfolio</title>
    <link rel="stylesheet" href="styles.css"> <!--Linking CSS File-->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: url('background image for an engineer portfolio.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        body.light-mode {
            background: url('background image for an engineer portfolio.png') no-repeat center center fixed;
            background-size: cover;
            color: #000000;
        }
        body.dark-mode {
            background: url('background image for an engineer portfolio.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
        }
        .container {
            background: rgba(31, 31, 31, 0.8);
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.5s, color 0.5s;
        }
        body.light-mode .container {
            background: rgba(255, 255, 255, 0.8);
            color: #000000;
        }
        body.dark-mode .container {
            background: rgba(31, 31, 31, 0.8);
            color: #ffffff;
        }
        .container h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .container a {
            color: #ff4081;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s;
        }
        .container a:hover {
            color: #ffffff;
        }
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                padding: 20px;
            }

            .container {
                padding: 30px;
            }

            .container h1 {
                font-size: 2em;
            }

            .container a {
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            body {
                flex-direction: column;
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            .container h1 {
                font-size: 1.8em;
            }

            .container a {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container">
        <h1>Welcome to My Portfolio</h1>
        <p>Explore my projects, skills, and more.</p>
        <a href="Arjun Mankuskar.html">Enter Portfolio</a>
    </div>
    <script>
        function toggleMode() {
            const body = document.body;
            body.classList.toggle('light-mode');
            body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
